<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- =====================================================================
     BMO Design System · curated icon sprite

     Symbol id convention:  ic-fluent-{icon}-{size}-{variant}
     (matches Fluent System Icons filename tokens, e.g.
      ic_fluent_home_24_regular.svg  ->  ic-fluent-home-24-regular)

     Use it TWO equivalent ways; both resolve to the same symbol:
       no-JS :  <svg class="icon"><use href="#ic-fluent-home-24-regular"/></svg>
                (add a size helper class on the svg as needed)
       sugar :  <fluent-icon name="home-24-regular"></fluent-icon>

     LOADING: symbols are referenced same-document (href="#id"), which is what
     fluent-icon.js and the copy-paste snippets emit. So INLINE this block into
     the page (drop it in the body once). It can also be hosted as a file and
     referenced as bmo-icons.svg#id, but then you must also point
     fluent-icon.js resolve() at the file path.

     ART: placeholder line icons on a 24x24 grid, fill:none + currentColor, so
     they inherit text color and scale with the .icon size helpers. For a real
     project, replace each placeholder with the matching real Fluent 24 glyph
     copied from the fluentui-system-icons repo (its svg/ folder) — an expected
     visual change, same 24 viewBox, no reflow. Not every Fluent icon ships in
     every size; 24 regular is the most universally available, so the whole set
     is normalized to it.

     OLD -> NEW id map (the fork this retires):
       #ic-home / semantic        ->  #ic-fluent-home-24-regular
       #ic-close, #ic-x           ->  #ic-fluent-dismiss-24-regular
       #i-arrow, #ic-arrow-right  ->  #ic-fluent-arrow-right-24-regular
       #i-chev, #ic-chev-right    ->  #ic-fluent-chevron-right-24-regular
       #ic-chev-down              ->  #ic-fluent-chevron-down-24-regular
       #ic-more                   ->  #ic-fluent-more-horizontal-24-regular
       #ic-warn                   ->  #ic-fluent-warning-24-regular
       #ic-doc                    ->  #ic-fluent-document-24-regular
       #ic-dollar                 ->  #ic-fluent-money-24-regular
       #i-bell                    ->  #ic-fluent-alert-24-regular
       #i-export                  ->  #ic-fluent-arrow-export-24-regular
       #i-inbox                   ->  #ic-fluent-mail-inbox-24-regular
       #i-policy                  ->  #ic-fluent-shield-24-regular
       #i-chart                   ->  #ic-fluent-data-bar-vertical-24-regular
       #ic-calendar               ->  #ic-fluent-calendar-ltr-24-regular
     (Some are best-guess Fluent names: money, shield, data-bar-vertical,
      mail-inbox especially. Confirm against the Fluent reference before the
      real-asset swap; the names are the durable contract, so adjust here.)

     ADD AN ICON: take ic_fluent_{name}_24_regular.svg from the fluentui-system-icons
     repo, wrap its <path>s in <symbol id="ic-fluent-{name}-24-regular"
     viewBox="0 0 24 24">, and change each path's baked fill="#212121" to
     fill="currentColor". Real Fluent glyphs are filled shapes, not strokes —
     never set them to fill:none. For a filled variant, suffix the id with
     24-filled. For more than one or two extras, use the Fluent Resizable icon
     font instead (docs/TECHNICAL-REFERENCE.md §6).
     ===================================================================== -->
<defs>

  <!-- add -->
  <symbol id="ic-fluent-add-24-regular" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g></symbol>

  <!-- alert (bell) -->
  <symbol id="ic-fluent-alert-24-regular" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a5 5 0 0 1 5 5c0 5 2 6 2 6H5s2-1 2-6a5 5 0 0 1 5-5zM10.3 19a1.8 1.8 0 0 0 3.4 0"/></g></symbol>

  <!-- arrow-down -->
  <symbol id="ic-fluent-arrow-down-24-regular" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12l6 6 6-6"/></g></symbol>

  <!-- arrow-export -->
  <symbol id="ic-fluent-arrow-export-24-regular" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-5M14 5h5v5M19 5l-8 8"/></g></symbol>

  <!-- arrow-right -->
  <symbol id="ic-fluent-arrow-right-24-regular" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"/></g></symbol>

  <!-- arrow-up -->
  <symbol id="ic-fluent-arrow-up-24-regular" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></g></symbol>

  <!-- attach -->
  <symbol id="ic-fluent-attach-24-regular" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 8.5l-6 6a2 2 0 1 0 2.8 2.8l6-6a3.5 3.5 0 0 0-5-5l-6.5 6.5a5 5 0 0 0 7 7l5.5-5.5"/></g></symbol>

